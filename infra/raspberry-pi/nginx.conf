worker_processes 1;
pid /tmp/nginx.pid;
# Even an error entry can append the request URL and its sensitive filters.
# Readiness and container state provide monitoring without recording requests.
error_log /dev/null crit;

events { worker_connections 256; }

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 2m;
    keepalive_timeout 30s;
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream rest_api {
        zone rest_api 64k;
        server postgrest:3000 resolve;
    }
    upstream rest_readiness {
        zone rest_readiness 64k;
        server postgrest:3001 resolve;
    }

    server {
        listen 8080;
        add_header Cache-Control "no-store" always;

        # Only readiness is unauthenticated. No metrics/admin port is published.
        location = /healthz {
            proxy_pass http://rest_readiness/ready;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        location ~ ^/rest/v1/(users|user_preferences|api_keys|devices|firmware_versions|api_usage|custom_webhooks|ai_usage_reports|device_delivery|device_displays|orders)/?$ {
            # Supabase JS appends /rest/v1; PostgREST expects /<table>.
            rewrite ^/rest/v1/([^/]+)/?$ /$1 break;
            proxy_pass http://rest_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_buffering off;
        }

        location / { return 404; }
    }
}
