[platformio]
default_envs = elecrow_213

[env]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
upload_speed = 460800

lib_deps =
    bblanchon/ArduinoJson@7.4.2
    esphome/ESPAsyncWebServer-esphome@3.3.0
    esphome/AsyncTCP-esphome@2.1.4

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D DEBUG_ESP_PORT=Serial

extra_scripts =
    pre:scripts/version_check.py

[env:esp32dev]
board = esp32dev
; Wi-Fi + the built-in BLE stack exceed the default 1.3 MiB app slot.
; OTA is disabled; USB factory installs include this 3 MiB app partition.
board_build.partitions = huge_app.csv
lib_deps =
    ${env.lib_deps}
    zinggjm/GxEPD2@1.6.4
lib_ignore = EPD

; ──────────────────────────────────────────────────────────────────────────────
; Elecrow CrowPanel ESP32 2.13" E-Paper (ESP32-S3, SSD1680Z/JD79661)
; EPD library: firmware/lib/EPD/ — ESP32-compatible rewrite, committed in repo
; ──────────────────────────────────────────────────────────────────────────────
[env:elecrow_213]
board = esp32-s3-devkitc-1

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

build_flags =
    ${env.build_flags}
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ELECROW_EPAPER_213
    -I lib/EPD

; CrowPanel V1.2 uses JD79661: same PCB pins, incompatible display protocol.
[env:elecrow_213_v12]
extends = env:elecrow_213
build_flags =
    ${env:elecrow_213.build_flags}
    -D ELECROW_PANEL_JD79661
