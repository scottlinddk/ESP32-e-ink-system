name: Deploy to Coolify

# Flow (https://coolify.io/docs/applications/sources/github/actions):
# checks -> build + push images to GHCR -> trigger Coolify deploy webhooks.
# Coolify only pulls published images; it never builds from source.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-coolify
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
            build_args: ""
          - name: frontend
            dockerfile: frontend/Dockerfile
            build_args: |
              VITE_CLERK_PUBLISHABLE_KEY=${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        # GHCR requires lowercase repository paths.
        run: echo "name=${IMAGE_PREFIX,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    strategy:
      matrix:
        include:
          - name: backend
            webhook: COOLIFY_WEBHOOK_BACKEND
          - name: frontend
            webhook: COOLIFY_WEBHOOK_FRONTEND
    steps:
      - name: Trigger Coolify deploy (${{ matrix.name }})
        env:
          COOLIFY_WEBHOOK: ${{ secrets[matrix.webhook] }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail --show-error --silent \
            --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
