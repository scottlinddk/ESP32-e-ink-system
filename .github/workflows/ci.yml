name: Application checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # A disposable PostgreSQL for the persistence integration tests. Each test file creates and
    # drops its own database from the real migrations and backend/src/db/roles/app-role.sql.
    # Never point TEST_DATABASE_URL at a database you care about.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Fail the build instead of silently skipping the database tests.
      REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
