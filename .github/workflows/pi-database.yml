# LEGACY: offline checks for the Raspberry Pi / PostgREST tooling in infra/raspberry-pi.
# The API no longer talks to PostgREST (it connects with DATABASE_URL), so the PostgREST + Supabase SDK
# integration step was removed. Schema migrations are now exercised against a real PostgreSQL by ci.yml.
name: Raspberry Pi tooling (legacy)

on:
  pull_request:
    paths:
      - "infra/raspberry-pi/**"
      - "backend/src/db/migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pi-database.yml"
  push:
    branches: [main]
    paths:
      - "infra/raspberry-pi/**"
      - "backend/src/db/migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pi-database.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install test dependencies
        run: |
          npm ci
          python -m pip install -r infra/raspberry-pi/requirements.txt
      - name: Offline tests and shell syntax
        run: |
          python -m unittest discover -s infra/raspberry-pi/tests -v
          python -m unittest discover -s infra/raspberry-pi -p 'test_*.py' -v
          for script in infra/raspberry-pi/*.sh infra/raspberry-pi/init/*.sh; do
            bash -n "$script"
          done
