name: Build and Release Firmware

on:
  push:
    branches: [main]
    paths: ['firmware/**', '.github/workflows/firmware-release.yml']
    tags: ['v*.*.*']
  pull_request:
    paths: ['firmware/**', '.github/workflows/firmware-release.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Artifact version (manual runs do not publish a release)'
        required: false
        default: 'dev'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', 'firmware/partitions*.csv') }}
          restore-keys: |
            pio-${{ runner.os }}-
      - name: Install PlatformIO
        run: pip install platformio==6.1.18
      - name: Test configuration and packaging
        run: python -m unittest discover -s firmware/scripts -p 'test_*.py' -v
      - name: Test display protocols and input validation
        run: python firmware/scripts/run_host_tests.py
      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            VERSION="${INPUT_VERSION:-dev}"
          else
            VERSION="dev-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Prepare firmware configuration
        env:
          PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
          VERSION: ${{ steps.version.outputs.version }}
        run: python firmware/scripts/prepare_config.py --version "$VERSION"
      - name: Compile all supported boards and panel revisions
        working-directory: firmware
        run: pio run -e esp32dev -e elecrow_213 -e elecrow_213_v12 -e waveshare_rlcd_42
      - name: Package and validate complete browser images
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python firmware/scripts/package_web_firmware.py --output-dir build/firmware-release --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-release
          path: build/firmware-release/
          if-no-files-found: error
          retention-days: 30
    outputs:
      version: ${{ steps.version.outputs.version }}

  publish:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-release
          path: firmware-release
      - name: Publish verified firmware assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Elecrow CrowPanel 2.13 + Waveshare FW ${{ needs.build.outputs.version }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/') }}
          fail_on_unmatched_files: true
          files: firmware-release/*
          body: |
            Flash from the web app's Flash/Firmware page using desktop Chrome or Edge over HTTPS.
            Select the physical board/panel revision before connecting: the original CrowPanel
            uses SSD1680, and CrowPanel V1.2 uses JD79661. USB chip detection cannot tell them apart.

            Files are named `<board>_fw-<version>_<image>.bin`. The `*_factory.bin` images
            (`waveshare-esp32-213-v2`, `elecrow-crowpanel-213`, `elecrow-crowpanel-213-v12`,
            `waveshare-esp32-s3-rlcd-42`) are complete browser/USB installation images at offset 0.
            `manifest.json` covers Waveshare 2.13 and original CrowPanel; `manifest-elecrow-v12.json`
            covers the V1.2 panel; `manifest-waveshare-rlcd-42.json` covers the Waveshare
            ESP32-S3-RLCD-4.2 (USB install with esptool or ESP Web Tools; not yet on the Flash page). The `app`,
            `bootloader` and `partitions` binaries are application-only parts.
            SHA256SUMS records the binaries produced by the build. See docs/FIRMWARE_FLASHING.md.
